name: Submit Your Build
description: Add your Flappy AI Jam game to the playable gallery.
title: "[Submission] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: Share a public link that opens your game. GitHub Pages, Gemini Canvas, and other public HTTPS hosts are welcome. Issues and approved builds are public.
  - type: input
    id: title
    attributes:
      label: Build Title
      placeholder: Flappy Seagull
    validations:
      required: true
  - type: input
    id: builder
    attributes:
      label: Builder Name
      placeholder: Your name or team name
    validations:
      required: true
  - type: input
    id: linkedin
    attributes:
      label: LinkedIn URL (optional)
      placeholder: https://www.linkedin.com/in/your-name/
  - type: dropdown
    id: track
    attributes:
      label: Track
      options:
        - Technical Execution
        - Game Feel
        - Creative Mutation
      default: 0
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Key Prompt Used
      description: Paste the exact one or two sentences you used to make your main change.
    validations:
      required: true
  - type: input
    id: game_url
    attributes:
      label: Game URL
      description: Paste the link people use to open your game.
      placeholder: https://your-name.github.io/flappy-ai-jam/
    validations:
      required: true
