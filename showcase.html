<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#073B5C">
  <meta name="description" content="Play projects from the University of Portsmouth AI Society's 30-Minute Flappy AI Jam and read the prompts behind them.">
  <title>Flappy AI Jam · Hall of Fame</title>
  <style>
    /* Palette and lockup from uopaisociety/society/brand and the Protocol: Aero starter. */
    :root {
      --navy:#073b5c; --deep:#06283f; --ink:#111820; --cream:#f7f5f0;
      --sand:#e8d9b9; --sage:#a7bfb4; --gold:#d7bf78; --sea:#287d9b;
      --line:rgb(167 191 180 / .28); --muted:#a7bfb4;
      --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
      color-scheme:dark; background:var(--ink); color:var(--cream);
      font: 1rem/1.5 system-ui,sans-serif;
    }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; }
    h1,h2,p { margin:0; }
    a { color:inherit; text-underline-offset:.2em; }
    a,button { touch-action:manipulation; }
    :focus-visible { outline:2px solid var(--gold); outline-offset:4px; }
    .wrap { width:min(100% - 2rem, 77rem); margin-inline:auto; }
    .masthead { border-bottom:1px solid var(--line); }
    .masthead .wrap, footer .wrap { display:flex; align-items:center; justify-content:space-between; gap:1rem; }
    .masthead .wrap { min-height:5.5rem; }
    .lockup { display:block; width:10rem; height:3.6rem; background:var(--cream); object-fit:cover; }
    .action, button {
      display:inline-flex; min-height:2.65rem; align-items:center; justify-content:center; gap:.5rem;
      padding:.55rem .85rem; color:inherit; background:transparent; border:1px solid var(--line);
      text-decoration:none; font:650 .9rem/1.2 system-ui,sans-serif; cursor:pointer;
    }
    .action:hover, button:hover { border-color:var(--cream); background:var(--navy); }
    .primary { color:var(--ink); background:var(--cream); border-color:var(--cream); }
    .primary:hover { color:var(--cream); background:var(--navy); }
    .hero { isolation:isolate; padding:clamp(2.4rem,7vw,6rem) 0 clamp(2rem,5vw,4rem); position:relative; overflow:hidden; border-bottom:1px solid var(--line); }
    .hero::before {
      content:""; position:absolute; inset:0; z-index:-1; background:
        linear-gradient(90deg,var(--ink),rgb(17 24 32 / .35)),
        repeating-linear-gradient(90deg,transparent 0 63px,var(--line) 63px 64px),
        repeating-linear-gradient(0deg,transparent 0 63px,var(--line) 63px 64px), var(--deep);
    }
    .meta { color:var(--muted); font:650 .76rem/1.45 var(--mono); letter-spacing:.075em; }
    .hero h1 { font-size:clamp(3.2rem,10vw,8.25rem); letter-spacing:-.082em; line-height:.98; margin:.65rem 0 1.2rem; }
    .hero .intro { max-width:44rem; color:var(--sand); font-size:clamp(1rem,2vw,1.24rem); }
    .gallery { padding:1.4rem 0 3.5rem; min-height:40vh; }
    .gallery-bar { display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin-bottom:1.2rem; }
    .filters { display:flex; flex-wrap:wrap; gap:.4rem; }
    .filters button[aria-pressed="true"] { border-color:var(--sage); color:var(--ink); background:var(--sage); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr)); gap:1rem; }
    .card { display:flex; flex-direction:column; min-width:0; border:1px solid var(--line); background:var(--ink); }
    .card-art { display:block; width:100%; height:8.4rem; object-fit:cover; border-bottom:1px solid var(--line); background:var(--deep); }
    .card-body { display:flex; flex-direction:column; align-items:start; gap:.7rem; padding:1rem; flex:1; }
    .card h2 { font-size:1.55rem; letter-spacing:-.036em; line-height:1.12; overflow-wrap:anywhere; }
    .card p, .dialog-copy p { overflow-wrap:anywhere; }
    .byline { color:var(--muted); font-size:.88rem; }
    .byline a { margin-inline-start:.35em; }
    .badges { display:flex; flex-wrap:wrap; gap:.35rem; }
    .badge { padding:.23rem .45rem; border:1px solid var(--line); color:var(--sage); font:650 .68rem/1.35 var(--mono); text-transform:uppercase; }
    .badge.winner { border-color:var(--gold); color:var(--gold); }
    details { width:100%; border-top:1px solid var(--line); }
    summary { padding:.7rem 0 0; cursor:pointer; font-size:.9rem; font-weight:650; }
    pre { margin:.5rem 0 0; padding:.7rem; border:1px solid var(--line); background:var(--deep); white-space:pre-wrap; overflow-wrap:anywhere; font:.81rem/1.5 var(--mono); }
    .launch { margin-top:auto; }
    .message { padding:1rem; border:1px solid var(--line); color:var(--sand); }
    footer { padding:1.1rem 0; border-top:1px solid var(--line); color:var(--muted); font-size:.86rem; }
    dialog { width:min(100% - 1rem, 60rem); max-height:calc(100dvh - 1rem); padding:0; border:1px solid var(--sage); color:var(--cream); background:var(--ink); }
    dialog::backdrop { background:rgb(17 24 32 / .86); }
    .dialog-bar { display:flex; align-items:center; justify-content:space-between; padding:.65rem 1rem; border-bottom:1px solid var(--line); }
    .dialog-grid { display:grid; grid-template-columns:auto 1fr; gap:1.1rem; align-items:start; padding:1rem; }
    .frame-box { position:relative; width:min(480px,57vw,max(240px,calc((100dvh - 7rem) * .75))); aspect-ratio:3 / 4; overflow:hidden; background:var(--deep); outline:1px solid var(--line); }
    .frame-box iframe { position:absolute; inset:0; border:0; width:480px; height:640px; transform-origin:top left; transform:scale(var(--frame-scale,1)); }
    .frame-message { position:absolute; inset:0; display:grid; align-content:center; text-align:center; padding:1rem; }
    .dialog-copy { min-width:0; display:grid; gap:.8rem; justify-items:start; }
    .dialog-copy h2 { font-size:clamp(1.45rem,3vw,2.25rem); line-height:1.08; overflow-wrap:anywhere; }
    .dialog-copy .action, .dialog-copy button { width:100%; }
    #share-url { width:100%; padding:.55rem; color:var(--cream); background:var(--deep); border:1px solid var(--line); }
    @media (max-width:43rem) {
      .dialog-grid { grid-template-columns:minmax(0,1fr); justify-items:center; }
      .frame-box { width:min(100%,480px,max(235px,calc((100dvh - 11rem) * .75))); }
      .dialog-copy { width:100%; }
    }
    @media (max-width:25rem) {
      .masthead .wrap { min-height:4.5rem; }
      .lockup { width:7rem; height:3rem; }
      .action,button { padding-inline:.6rem; }
    }
  </style>
</head>

  const frameMessage = byId("frame-message");
  const css = getComputedStyle(document.documentElement);
  const palette = Object.fromEntries(["deep","ink","line","navy","sea","sage","gold","cream"].map(
    (name) => [name, css.getPropertyValue("--" + name).trim()]));
  let builds = [];
  let filter = "all";
  let frame;
  let launchRequest;
  let active;
  let loaded = false;

  function element(tag, value, className) {
    const node = document.createElement(tag);
    if (value) node.textContent = value;
    if (className) node.className = className;
    return node;
  }

  function renderArtwork(build) {
    const canvas = element("canvas", "", "card-art");
    canvas.width = 620;
    canvas.height = 235;
    canvas.setAttribute("aria-hidden", "true");
    const ctx = canvas.getContext("2d");
    if (!ctx) return canvas;
    const colors = palette;
    ctx.fillStyle = colors.deep;
    ctx.fillRect(0, 0, 620, 235);
    ctx.strokeStyle = colors.line;
    ctx.beginPath();
    for (let x = 0; x < 620; x += 30) { ctx.moveTo(x, 0); ctx.lineTo(x, 235); }
    for (let y = 0; y < 235; y += 30) { ctx.moveTo(0, y); ctx.lineTo(620, y); }
    ctx.stroke();
    ctx.lineWidth = 3;
    ctx.strokeStyle = colors.sage;
    ctx.fillStyle = colors.gold;
    if (build.id === "01-neural-autopilot") {
      ctx.fillStyle = colors.navy;
      for (const [x, top, bottom] of [[242,61,148],[455,88,181]]) {
        ctx.fillRect(x, 0, 45, top);
        ctx.fillRect(x, bottom, 45, 235 - bottom);
        ctx.strokeRect(x, 0, 45, top);
        ctx.strokeRect(x, bottom, 45, 235 - bottom);
      }
      ctx.strokeStyle = colors.gold;
      ctx.beginPath();
      ctx.moveTo(25, 159);
      ctx.bezierCurveTo(130, 212, 154, 51, 254, 105);
      ctx.bezierCurveTo(350, 153, 371, 189, 475, 126);
      ctx.bezierCurveTo(530, 89, 557, 122, 600, 166);
      ctx.stroke();
    } else if (build.id === "02-voice-frequency-thruster") {
      for (let i = 0; i < 64; i++) {
        const rise = (5 + (Math.sin(i * .63) + 1) * 44 + (Math.cos(i * 1.6) + 1) * 21) * (1 - i / 93);
        ctx.fillStyle = i % 8 === 0 ? colors.gold : colors.sea;
        ctx.fillRect(8 + i * 9.5, 184 - rise, 6, rise);
      }
      ctx.beginPath();
      for (let i = 0; i <= 100; i++) ctx.lineTo(8 + i * 6, 104 + Math.sin(i * .42) * Math.sin(i * .09) * 28);
      ctx.stroke();
    } else if (build.id === "03-overclock-boss-protocol") {
      ctx.beginPath();
      for (let i = 0; i <= 6; i++) ctx.lineTo(468 + Math.cos(i * Math.PI / 3) * 58, 117 + Math.sin(i * Math.PI / 3) * 58);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(468, 117, 22, 0, Math.PI * 2);
      ctx.fill();
      for (const [x, y] of [[65,158],[136,88],[205,134],[274,104],[348,156],[353,61]]) {
        ctx.fillRect(x, y - 1, 34, 2);
        ctx.beginPath(); ctx.arc(x, y, 6, 0, 2 * Math.PI); ctx.fill();
      }
    } else {
      ctx.fillStyle = colors.sea;
      ctx.fillRect(240, 0, 36, 77);
      ctx.fillRect(240, 154, 36, 81);
      ctx.fillRect(424, 0, 36, 113);
      ctx.fillRect(424, 186, 36, 49);
      ctx.strokeStyle = colors.gold;
      ctx.beginPath();
      ctx.moveTo(60, 139); ctx.lineTo(144, 111); ctx.lineTo(172, 124); ctx.lineTo(142, 142); ctx.closePath(); ctx.stroke();
    }
    return canvas;
  }

  function validBuild(build) {
    if (!build || typeof build.id !== "string" || !handlePattern.test(build.id)
      || typeof build.title !== "string" || !build.title
      || typeof build.builder !== "string" || !build.builder
      || typeof build.github !== "string" || !handlePattern.test(build.github)
      || !Object.hasOwn(tracks, build.track)) return false;
    const expectedKind = build.id === "baseline" ? "baseline" : curated.has(build.id) ? "reference" : "submission";
    return build.kind === expectedKind && (expectedKind !== "submission" || build.id === build.github.toLowerCase());
  }

  function card(build) {
    const result = element("article", "", "card");
    const body = element("div", "", "card-body");
    const badges = element("div", "", "badges");
    badges.append(element("span", tracks[build.track], "badge"));
    if (build.kind === "reference") badges.append(element("span", "Reference mod", "badge"));
    if (build.kind === "baseline") badges.append(element("span", "Starter", "badge"));
    if (build.winner === true) badges.append(element("span", "Event winner", "badge winner"));
    const byline = element("p", build.builder, "byline");
    const github = element("a", "@" + build.github);
    github.href = "https://github.com/" + build.github;
    byline.append(github);
    if (typeof build.linkedin === "string") {
      try {
        const url = new URL(build.linkedin);
        if (url.protocol === "https:" && ["www.linkedin.com", "linkedin.com"].includes(url.hostname)
          && !url.username && !url.password) {
          const profile = element("a", "LinkedIn");
          profile.href = url.href;
          byline.append(profile);
        }
      } catch { /* Optional profile links may be omitted. */ }
    }
    body.append(badges, element("h2", build.title), byline);
    if (typeof build.description === "string" && build.description) body.append(element("p", build.description));
    if (typeof build.prompt === "string" && build.prompt) {
      const details = element("details");
      const pre = element("pre");
      pre.append(element("code", build.prompt));
      details.append(element("summary", build.winner === true ? "The Winning Prompt" : "Prompt used"), pre);
      body.append(details);
    }
    const launch = element("button", "Launch Build", "action primary launch");
    launch.type = "button";
    launch.setAttribute("aria-label", "Launch " + build.title);
    launch.addEventListener("click", () => { void launchBuild(build); });
    body.append(launch);
    result.append(renderArtwork(build), body);
    return result;
  }

  function render() {
    if (!loaded) return;
    const visible = builds.filter((build) => filter === "all" ||
      (filter === "winner" ? build.winner === true : build.kind === "reference"));
    byId("grid").replaceChildren(...visible.map(card));
    byId("count").textContent = visible.length + (visible.length === 1 ? " BUILD" : " BUILDS");
    const message = byId("message");
    message.hidden = Boolean(visible.length);
    message.textContent = filter === "winner" ? "Event winners will appear here after judging." : "No builds to display.";
  }

  function directLink(id) {
    const url = new URL(location.href);
    if (id) url.searchParams.set("build", id);
    else url.searchParams.delete("build");
    url.hash = "";
    return url.href;
  }

  function resizeFrame() {
    frameBox.style.setProperty("--frame-scale", String(frameBox.clientWidth / 480));
  }

  async function launchBuild(build) {
    launchRequest?.abort();
    launchRequest = new AbortController();
    const { signal } = launchRequest;
    frame?.remove();
    frame = null;
    active = build;
    history.replaceState(null, "", directLink(build.id));
    byId("player-title").textContent = build.title;
    byId("player-builder").textContent = build.builder + " · @" + build.github;
    byId("copy-status").textContent = "";
    byId("share-url").hidden = true;
    const known = curated.get(build.id);
    const path = known?.path ?? "submissions/" + build.id + ".html";
    byId("source").href = repository + "/blob/main/" + path;
    byId("standalone").hidden = !known;
    if (known) byId("standalone").href = path;
    else byId("standalone").removeAttribute("href");
    byId("player-controls").textContent = known?.controls ?? "Click inside the game to give it keyboard focus.";
    frameMessage.hidden = false;
    frameMessage.textContent = "Loading build…";
    if (!dialog.open) dialog.showModal();
    resizeFrame();

    const preview = element("iframe");
    preview.title = build.title;
    preview.width = "480";
    preview.height = "640";
    preview.setAttribute("sandbox", "allow-scripts");
    preview.setAttribute("allow", "microphone 'none'; camera 'none'");
    preview.referrerPolicy = "no-referrer";
    if (known) {
      preview.src = path;
    } else {
      try {
        const response = await fetch("submissions/" + build.id + ".txt", { cache: "no-cache", signal });
        if (!response.ok) throw new Error("Build unavailable");
        const source = await response.text();
        if (signal.aborted) return;
        // Start in an opaque origin and keep the untrusted, single-file game
        // offline. The policy comes before any user markup or scripts.
        const policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; " +
          "img-src data: blob:; media-src data: blob:; font-src data:; base-uri 'none'; form-action 'none'";
        preview.srcdoc = '<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="' +
          policy + '">' + source.replace(/^\s*<!doctype\s+html\s*>/i, "");
      } catch {
        if (!signal.aborted) frameMessage.textContent = "This build could not be loaded. Use View Source or try again.";
        return;
      }
    }
    preview.addEventListener("load", () => { if (frame === preview) frameMessage.hidden = true; });
    frame = preview;
    frameBox.append(preview);
  }

  dialog.addEventListener("close", () => {
    launchRequest?.abort();
    frame?.remove();
    frame = active = null;
    history.replaceState(null, "", directLink(null));
  });
  byId("copy").addEventListener("click", async () => {
    if (!active) return;
    const url = directLink(active.id);
    const status = byId("copy-status");
    try {
      await navigator.clipboard.writeText(url);
      status.textContent = "Link copied.";
    } catch {
      const input = byId("share-url");
      input.value = url;
      input.hidden = false;
      input.select();
      status.textContent = "Copy the selected link.";
    }
  });
  if (typeof ResizeObserver === "function") new ResizeObserver(resizeFrame).observe(frameBox);
  else window.addEventListener("resize", resizeFrame);

  document.querySelectorAll("[data-filter]").forEach((button) => {
    button.addEventListener("click", () => {
      filter = button.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach((candidate) => {
        candidate.setAttribute("aria-pressed", String(candidate === button));
      });
      render();
    });
  });

  async function loadManifest() {
    try {
      const response = await fetch("submissions/manifest.json", { cache: "no-cache" });
      if (!response.ok) throw new Error("Manifest unavailable");
      const manifest = await response.json();
      if (manifest.version !== 1 || !Array.isArray(manifest.builds)) throw new Error("Unsupported manifest");
      const seen = new Set();
      builds = manifest.builds.filter((build) => {
        if (!validBuild(build) || seen.has(build.id)) return false;
        seen.add(build.id);
        return true;
      });
      loaded = true;
      render();
      const selected = new URLSearchParams(location.search).get("build");
      const build = builds.find((entry) => entry.id === selected);
      if (build) void launchBuild(build);
      else if (selected) {
        const message = byId("message");
        message.textContent = "That build is not in the gallery.";
        message.hidden = false;
      }
    } catch {
      byId("message").textContent = location.protocol === "file:"
        ? "Serve this folder over HTTP to load the gallery. Reference mods also open directly from the examples folder."
        : "The gallery could not load its build list. Refresh to try again.";
    }
  }
  void loadManifest();
  </script>
</body>
</html>
