<!DOCTYPE html>
<!--
  FLAPPY AI JAM · UoP AI Society · The 30-Minute AI Game Jam
  A complete game in ONE file. No installs, no libraries, no images.
  HOW TO USE IT IN THE JAM:
    1. Copy this WHOLE file (Ctrl/Cmd + A, then Ctrl/Cmd + C).
    2. Paste it into Gemini (Canvas) and ask for changes.
    3. Always ask Gemini for the FULL file back, then preview or save it.
  "AI PROMPT ZONE" comments mark each part. Change anything. Make it weird.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flappy AI Jam · UoP AI Society</title>
<style>
  :root { --ink:#021825; --navy:#073B5C; --cream:#F7F5F0; --accent:#E6B325; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--ink); color:var(--cream); color-scheme:dark;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  body { display:flex; flex-direction:column; overflow:hidden; }
  header, footer { display:flex; align-items:center; padding:10px 16px; flex:none; }
  header { justify-content:space-between; gap:12px; border-bottom:1px solid rgba(247,245,240,.14); }
  .brand { font-size:13px; font-weight:650; letter-spacing:.14em; text-transform:uppercase; white-space:nowrap; }
  .brand span { display:block; margin-top:3px; font-size:10px; font-weight:500; letter-spacing:.04em; opacity:.62; text-transform:none; }
  #status { flex:none; white-space:nowrap; font:11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.14em; color:var(--accent); border:1px solid var(--accent); border-radius:4px; padding:5px 8px; }
  main { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:12px; }
  canvas { background:var(--cream); display:block; touch-action:none; border-radius:16px;
    border:1px solid rgba(247,245,240,.28); box-shadow:0 18px 50px rgba(0,0,0,.45); }
  footer { justify-content:center; border-top:1px solid rgba(247,245,240,.14);
    font:11px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.16em; opacity:.72; }
</style>
</head>
<body>
<header>
  <div class="brand">Flappy AI Jam<span>UoP AI Society</span></div>
  <div id="status" aria-live="polite">MENU</div>
</header>
<main><canvas id="game" width="400" height="600"></canvas></main>
<footer>SPACE · UP · CLICK · TAP</footer>
<script>
// === AI PROMPT ZONE: CONFIG ===
// Tweak these numbers first. They change how the whole game feels.
const W = 400, H = 600;
const GRAVITY = 0.45, FLAP_STRENGTH = -7.5;
const PIPE_GAP = 160, PIPE_WIDTH = 64, PIPE_SPEED = 2.6, PIPE_SPACING = 220, GROUND_H = 70;
const COLORS = { navy:"#073B5C", cream:"#F7F5F0", bird:"#FFC93C", beak:"#FF7A00", pipe:"#0E5A8A", ground:"#C9B79C" };
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
let state = "start", bird, pipes, score, frame, overFrame = 0, best = 0;
try { best = Number(localStorage.getItem("flappyAiJamBest")) || 0; } catch (e) {}

function resize() {
  const chrome = document.querySelector("header").offsetHeight + document.querySelector("footer").offsetHeight + 24;
  const scale = Math.max(0.2, Math.min((innerWidth - 24) / W, (innerHeight - chrome) / H));
  canvas.style.width = Math.floor(W * scale) + "px";
  canvas.style.height = Math.floor(H * scale) + "px";
}
addEventListener("resize", resize);
resize();

function reset() {
  bird = { x:100, y:H / 2, vy:0, r:16 };
  pipes = []; score = 0; frame = 0;
}

// === AI PROMPT ZONE: PHYSICS ===
// Gravity pulls the bird down every frame. A flap sets an upward speed.
function flap() {
  if (state === "start") state = "playing";
  else if (state === "over") {
    if (frame - overFrame > 30) { reset(); state = "start"; } // Short pause stops accidental restarts
    return;
  }
  bird.vy = FLAP_STRENGTH;
}
function updateBird() {
  bird.vy += GRAVITY;
  bird.y += bird.vy;
  if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }
  if (bird.y + bird.r > H - GROUND_H) gameOver();
}

// === AI PROMPT ZONE: PIPES / LEVEL ===
// New pipe pairs spawn on the right with a random gap.
function updatePipes() {
  const last = pipes[pipes.length - 1];
  if (!last || last.x < W - PIPE_SPACING) {
    pipes.push({ x:W, top:60 + Math.random() * (H - GROUND_H - PIPE_GAP - 120), passed:false });
  }
  for (const p of pipes) {
    p.x -= PIPE_SPEED;
    const hitX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_WIDTH;
    const hitY = bird.y - bird.r < p.top || bird.y + bird.r > p.top + PIPE_GAP;
    if (hitX && hitY) gameOver();
    if (!p.passed && p.x + PIPE_WIDTH < bird.x) { p.passed = true; score++; }
  }
  pipes = pipes.filter(p => p.x + PIPE_WIDTH > -10);
}

// === AI PROMPT ZONE: GRAPHICS ===
// Everything is drawn with simple shapes. No image files.
function drawBackground() {
  ctx.fillStyle = COLORS.cream;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(7,59,92,0.08)";
  for (let i = 0; i < 4; i++) {
    const cx = ((i * 140 - frame * 0.4) % (W + 120) + W + 120) % (W + 120) - 60;
    ctx.beginPath(); ctx.arc(cx, 90 + i * 45, 30, 0, Math.PI * 2); ctx.arc(cx + 30, 85 + i * 45, 22, 0, Math.PI * 2); ctx.fill();
  }
}
function drawPipes() {
  for (const p of pipes) {
    ctx.fillStyle = COLORS.pipe;
    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
    ctx.fillRect(p.x, p.top + PIPE_GAP, PIPE_WIDTH, H - GROUND_H - p.top - PIPE_GAP);
    ctx.fillStyle = COLORS.navy;
    ctx.fillRect(p.x - 4, p.top - 20, PIPE_WIDTH + 8, 20);
    ctx.fillRect(p.x - 4, p.top + PIPE_GAP, PIPE_WIDTH + 8, 20);
  }
}
function drawGround() {
  ctx.fillStyle = COLORS.ground;
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
  ctx.fillStyle = COLORS.navy;
  ctx.fillRect(0, H - GROUND_H, W, 4);
}
function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(Math.max(-0.5, Math.min(1.2, bird.vy * 0.08)));
  ctx.fillStyle = COLORS.bird;
  ctx.beginPath(); ctx.arc(0, 0, bird.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(6, -5, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = COLORS.navy; ctx.beginPath(); ctx.arc(8, -5, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = COLORS.beak; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(24, 4); ctx.lineTo(12, 8); ctx.fill();
  ctx.restore();
}

// === AI PROMPT ZONE: SCORE & GAME OVER ===
function gameOver() {
  if (state !== "playing") return;
  state = "over"; overFrame = frame;
  if (score > best) { best = score; try { localStorage.setItem("flappyAiJamBest", best); } catch (e) {} }
}
function drawText(text, y, size) {
  ctx.fillStyle = COLORS.navy; ctx.font = "bold " + size + "px system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.fillText(text, W / 2, y);
}
function drawUI() {
  if (state === "playing") drawText(score, 80, 48);
  if (state === "start") {
    drawText("FLAPPY AI JAM", H / 2 - 90, 36);
    drawText("Space / Click / Tap to flap", H / 2 + 70, 18);
    drawText("Best: " + best, H / 2 + 100, 18);
  }
  if (state === "over") {
    ctx.fillStyle = COLORS.cream;
    ctx.fillRect(40, H / 2 - 110, W - 80, 200);
    ctx.strokeStyle = COLORS.navy; ctx.lineWidth = 4; ctx.strokeRect(40, H / 2 - 110, W - 80, 200);
    drawText("GAME OVER", H / 2 - 60, 36);
    drawText("Score: " + score + "   Best: " + best, H / 2 - 10, 22);
    drawText("Tap / Space to restart", H / 2 + 40, 18);
  }
}

function loop() {
  frame++;
  const label = state === "playing" ? "PLAYING" : state === "over" ? "GAME OVER" : "MENU";
  if (statusEl.textContent !== label) statusEl.textContent = label;
  if (state === "playing") { updateBird(); updatePipes(); }
  else if (state === "start") bird.y = H / 2 + Math.sin(frame / 15) * 10;
  drawBackground(); drawPipes(); drawGround(); drawBird(); drawUI();
  requestAnimationFrame(loop);
}
addEventListener("keydown", e => { if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); flap(); } });
canvas.addEventListener("pointerdown", e => { e.preventDefault(); flap(); });
reset();
loop();
</script>
</body>
</html>
